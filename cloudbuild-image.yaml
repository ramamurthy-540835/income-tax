steps:
  - id: test-backend
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir -r requirements.txt
        python -m unittest discover -s itr_backend/tests -v
        python -m unittest discover -s itr_agent/tests -v

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: [test-backend]
    args:
      - build
      - -f
      - itr_backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}

substitutions:
  _REGION: asia-south1
  _REPOSITORY: income-tax
  _SERVICE: income-tax-api
  _TAG: latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
