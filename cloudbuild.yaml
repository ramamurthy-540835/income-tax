steps:
  # Run the repository tests before producing a deployable image.
  - id: test-backend
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir -r requirements.txt
        python -m unittest discover -s itr_backend/tests -v
        python -m unittest discover -s itr_agent/tests -v

  # Build the production image from the repository root. The Dockerfile copies
  # itr_backend and the official ITR schema assets into the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: [test-backend]
    args:
      - build
      - -f
      - itr_backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}

  # Cloud Run performs platform health checks against /healthz. Application
  # authentication remains Google OAuth inside the service.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push]
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_GOOGLE_OAUTH_CLIENT_ID}" || { echo "_GOOGLE_OAUTH_CLIENT_ID is required" >&2; exit 1; }
        gcloud run deploy "${_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}" \
          --region "${_REGION}" \
          --project "$PROJECT_ID" \
          --platform managed \
          --service-account "${_RUNTIME_SERVICE_ACCOUNT}" \
          --execution-environment gen2 \
          --cpu 1 \
          --memory 1Gi \
          --concurrency 40 \
          --timeout 300 \
          --max 10 \
          --set-env-vars "ENVIRONMENT=production,AUTH_MODE=google,GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID}" \
          --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}

substitutions:
  _REGION: asia-south1
  _REPOSITORY: income-tax
  _SERVICE: income-tax-api
  _TAG: latest
  _GCS_BUCKET: aidirac-503309-income-tax-prod
  _RUNTIME_SERVICE_ACCOUNT: income-tax-api@aidirac-503309.iam.gserviceaccount.com
  _GOOGLE_OAUTH_CLIENT_ID: ""

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
